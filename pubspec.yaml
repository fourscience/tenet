name: flow_state
description: >-
  A time-aware, effect-separated state management library for Dart and
  Flutter. State is now, Flows change it purely, Ripples fetch it
  asynchronously, Echoes react to it externally.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
