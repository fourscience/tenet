name: tenet_rxdart
description: >-
  rxdart interop for reson: rxThrottle/rxDebounce/rxRetry/rxRetryWhen wrap
  a Ripple with rxdart's real operators instead of reson's own
  retry/throttled, plus a Store extension for driving dispatch/send/
  runRipple straight from an rx-built Stream pipeline.
version: 0.1.0
homepage: https://github.com/fourscience/tenet/tree/main/packages/tenet_rxdart
repository: https://github.com/fourscience/tenet
issue_tracker: https://github.com/fourscience/tenet/issues

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  rxdart: ^0.28.0
  reson: ^0.6.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
