name: tenet_di
description: >-
  A minimal, Riverpod/Refena-flavored dependency injection library for
  Dart — declarative providers, a lazy caching container, an
  invalidation/notification graph, and testing overrides. Works with or
  without Flutter; see tenet_di_flutter for the widget bindings.
version: 0.2.1
homepage: https://github.com/fourscience/tenet/tree/main/packages/tenet_di
repository: https://github.com/fourscience/tenet
issue_tracker: https://github.com/fourscience/tenet/issues

environment:
  sdk: ^3.6.0

resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
