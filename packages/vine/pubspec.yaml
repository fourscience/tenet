name: vine
description: >-
  A dependency injection + reactive state container for Dart. Declare how
  things are made with Vine, read them with tap, and change a cell to
  have everything computed or future over it update — fine-grained,
  stale-while-revalidate async, zero codegen. See vine_flutter for the
  Flutter bindings.
version: 0.1.0
homepage: https://github.com/fourscience/tenet/tree/main/packages/vine
repository: https://github.com/fourscience/tenet
issue_tracker: https://github.com/fourscience/tenet/issues

environment:
  sdk: ^3.6.0

resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
