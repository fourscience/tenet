name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze & test all packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The workspace includes casus_flutter and vine_flutter, which
      # depend on the Flutter SDK — resolving the workspace at all (even
      # just for the pure-Dart packages) requires Flutter, since pub
      # workspaces resolve every member together. Plain `dart analyze`/
      # `dart run` work fine afterward against the already-resolved
      # package graph, but `dart test` and `dart pub publish` each
      # re-verify the whole workspace's resolution themselves and fail
      # the same way `dart pub get` would — so those two specifically go
      # through `flutter pub` below, even for the pure-Dart packages.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Verify formatting (whole packages/ tree)
        run: dart format --output=none --set-exit-if-changed packages

      - name: Analyze & test reson, casus, vine, tenet_rxdart
        run: |
          set -e
          for pkg in reson casus vine tenet_rxdart; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && dart analyze --fatal-infos && flutter pub run test)
            echo "::endgroup::"
          done

      - name: Run reson/casus/vine/tenet_rxdart examples
        run: |
          set -e
          (cd packages/reson && dart run example/reson_example.dart)
          (cd packages/reson && dart run example/intent_command_event_example.dart)
          (cd packages/casus && dart run example/casus_example.dart)
          (cd packages/vine && dart run example/vine_example.dart)
          (cd packages/tenet_rxdart && dart run example/tenet_rxdart_example.dart)

      - name: Verify reson, casus, vine, tenet_rxdart are publish-ready
        run: |
          set -e
          for pkg in reson casus vine tenet_rxdart; do
            (cd "packages/$pkg" && flutter pub publish --dry-run)
          done

      - name: Analyze & test casus_flutter, vine_flutter
        run: |
          set -e
          for pkg in casus_flutter vine_flutter; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && flutter analyze && flutter test)
            echo "::endgroup::"
          done

      - name: Verify casus_flutter, vine_flutter are publish-ready
        run: |
          set -e
          for pkg in casus_flutter vine_flutter; do
            (cd "packages/$pkg" && flutter pub publish --dry-run)
          done

      - name: Analyze casus_flutter's and vine_flutter's example apps
        run: |
          set -e
          for pkg in casus_flutter vine_flutter; do
            echo "::group::$pkg/example"
            (cd "packages/$pkg/example" && flutter pub get && flutter analyze)
            echo "::endgroup::"
          done
