# Publishes one of the pure-Dart packages (reson, tenet_result, tenet_di,
# tenet_rxdart) to pub.dev — tenet_di_flutter publishes via publish-flutter.yaml
# instead. This workflow still sets up Flutter: resolving the workspace
# at all requires it (tenet_di_flutter is a member), and `dart test`/
# `dart pub publish` each re-verify that resolution themselves and fail
# the same way `dart pub get` would — so those two go through
# `flutter pub` below, even though the package being published has no
# Flutter dependency of its own.
#
# Trigger: run manually from the Actions tab (or `gh workflow run
# publish.yaml -f package=reson`), picking the package to publish. The
# package's pubspec.yaml `version:` must already be bumped and
# CHANGELOG.md must already have an entry for it — the same conventions
# `dart pub publish` itself enforces.
#
# Authentication: this workflow authenticates to pub.dev with a stored
# credentials file (an API token), via the `PUB_CREDENTIALS` repository
# secret — not OIDC trusted publishing. One-time setup for a maintainer
# with publish rights on these packages:
#
#   1. Locally: `dart pub token add https://pub.dev` (or `dart pub login`
#      if you're on an older Dart SDK), and complete the browser flow.
#   2. Print the resulting credentials file:
#        cat ~/.config/dart/pub-credentials.json
#      (older SDKs write to ~/.pub-cache/credentials.json instead).
#   3. In this repo: Settings -> Secrets and variables -> Actions -> New
#      repository secret, named PUB_CREDENTIALS, value = that file's exact
#      JSON content.
#
# That token is long-lived — rotate it periodically (repeat step 1-3) and
# scope it to these packages only if pub.dev supports scoped tokens at
# the time you create it.
name: Publish a Dart package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - reson
          - tenet_result
          - tenet_di
          - tenet_rxdart

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.event.inputs.package }}
    runs-on: ubuntu-latest
    # Configure this environment under Settings -> Environments to require
    # manual approval before a publish runs, if desired.
    environment: pub.dev
    defaults:
      run:
        working-directory: packages/${{ github.event.inputs.package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The workspace includes tenet_di_flutter, which depends on the
      # Flutter SDK — resolving the workspace at all requires Flutter,
      # even though this workflow only ever publishes a pure-Dart
      # package. `flutter pub get` subsumes `dart pub get` here; the
      # rest of this workflow uses plain `dart` commands.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install workspace dependencies
        working-directory: .
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter pub run test

      - name: Install pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$PUB_CREDENTIALS" ]; then
            echo "::error::The PUB_CREDENTIALS secret is not set — see this workflow's header comment for setup steps." >&2
            exit 1
          fi
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS" > ~/.config/dart/pub-credentials.json

      - name: Dry run
        run: flutter pub publish --dry-run

      - name: Publish
        run: flutter pub publish --force
