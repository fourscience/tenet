# Publishes `tenet` to pub.dev.
#
# Trigger: push a tag matching v<version>, e.g. `git tag v0.1.0 && git push
# origin v0.1.0`. The tag's version must exactly match the `version:` field
# in pubspec.yaml, and CHANGELOG.md must already have an entry for it — the
# same conventions `dart pub publish` itself enforces.
#
# Authentication: this workflow authenticates to pub.dev with a stored
# credentials file (an API token), via the `PUB_CREDENTIALS` repository
# secret — not OIDC trusted publishing. One-time setup for a maintainer
# with publish rights on the `tenet` package:
#
#   1. Locally: `dart pub token add https://pub.dev` (or `dart pub login`
#      if you're on an older Dart SDK), and complete the browser flow.
#   2. Print the resulting credentials file:
#        cat ~/.config/dart/pub-credentials.json
#      (older SDKs write to ~/.pub-cache/credentials.json instead).
#   3. In this repo: Settings -> Secrets and variables -> Actions -> New
#      repository secret, named PUB_CREDENTIALS, value = that file's exact
#      JSON content.
#
# That token is long-lived — rotate it periodically (repeat step 1-3) and
# scope it to this package only if pub.dev supports scoped tokens at the
# time you create it.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Configure this environment under Settings -> Environments to require
    # manual approval before a publish runs, if desired.
    environment: pub.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Verify tag matches pubspec.yaml version
        run: |
          set -euo pipefail
          pubspec_version="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' (version $tag_version) does not match pubspec.yaml version $pubspec_version." >&2
            exit 1
          fi

      - name: Install pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$PUB_CREDENTIALS" ]; then
            echo "::error::The PUB_CREDENTIALS secret is not set — see this workflow's header comment for setup steps." >&2
            exit 1
          fi
          mkdir -p ~/.config/dart
          printf '%s' "$PUB_CREDENTIALS" > ~/.config/dart/pub-credentials.json

      - name: Dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force
